<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLARTEXT · Brainy-Wort-Würfel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<script>(function(){try{if(sessionStorage.getItem('klartext_login')!=='true')window.location.href='KLARTEXT_Login.html';}catch(e){}})();</script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B3A4B">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--m:#1B3A4B;--acc:#4FC3C7;--paper:#F5F0E8;--surface:#fff;--border:#DDD8CE;--ink:#2D2D2D;--muted:#7A7060;}
body{font-family:"DM Sans",sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;}
.header{background:var(--m);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(1rem,4vw,2rem);border-bottom:3px solid var(--acc);position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;}
.logo-mark{width:32px;height:32px;border:2px solid var(--acc);border-radius:6px;display:flex;align-items:center;justify-content:center;}
.logo-mark span{font-family:"Playfair Display",serif;font-size:12px;font-weight:700;color:#fff;}
.logo-text{font-family:"Playfair Display",serif;font-size:1rem;font-weight:700;color:#fff;}
.back-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .7rem;border:1.5px solid var(--acc);border-radius:20px;color:var(--acc);font-size:.7rem;font-weight:700;text-decoration:none;}
.hero{background:linear-gradient(135deg,var(--m) 0%,#2A5570 100%);padding:1.75rem clamp(1rem,4vw,2rem);text-align:center;}
.hero-icon{font-size:2.2rem;margin-bottom:.4rem;}
.hero-titel{font-family:"Playfair Display",serif;font-size:clamp(1.3rem,3vw,1.8rem);font-weight:700;color:#fff;margin-bottom:.3rem;}
.hero-sub{font-size:.82rem;color:rgba(255,255,255,.6);max-width:560px;margin:0 auto;}
.shell{max-width:520px;margin:0 auto;padding:2rem clamp(.75rem,3vw,2rem) 5rem;text-align:center;}

.wuerfel-karte{background:var(--surface);border:2px solid var(--border);border-radius:22px;padding:2rem 1.5rem;box-shadow:0 4px 18px rgba(27,58,75,.1);}
#brainy-img{width:150px;height:150px;margin-bottom:1.25rem;transition:transform .6s cubic-bezier(.175,.885,.32,1.275);}
.spin{transform:rotate(360deg) scale(.8);}

#aktion-box{font-family:"Playfair Display",serif;font-size:1.35rem;font-weight:700;min-height:4rem;display:flex;align-items:center;justify-content:center;border-radius:15px;margin-bottom:1rem;padding:1rem 1.1rem;background:var(--paper);color:var(--ink);line-height:1.35;}

#ideen-box{display:none;background:#fff;border:2px dashed var(--border);border-radius:14px;padding:.9rem 1rem;margin-bottom:1.5rem;}
#ideen-box.zeigen{display:block;}
.ideen-label{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.55rem;}
.ideen-chips{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;}
.ideen-chip{background:var(--paper);border:1.5px solid var(--border);border-radius:20px;padding:.35rem .85rem;font-size:.85rem;font-weight:600;color:var(--ink);}

.wuerfel-btn{background:var(--m);color:#fff;border:none;padding:.95rem 2.2rem;font-family:inherit;font-size:1rem;font-weight:700;border-radius:50px;cursor:pointer;transition:background .2s;}
.wuerfel-btn:hover{background:#2A5570;}
</style>
</head>
<body>

<header class="header">
  <a class="logo" href="KLARTEXT_Spiele.html">
    <div class="logo-mark"><span>K</span></div>
    <div class="logo-text">KLARTEXT · Spiele</div>
  </a>
  <a class="back-btn" href="KLARTEXT_Spiele.html">← Spiele</a>
</header>

<div class="hero">
  <div class="hero-icon">🎲</div>
  <h1 class="hero-titel">Brainy-Wort-Würfel</h1>
  <p class="hero-sub">Würfeln und die Aufgabe erfüllen — spielerisches Sprach- und Handlungstraining für DaZ.</p>
</div>

<div class="shell">
  <div class="wuerfel-karte">
    <img id="brainy-img" src="brainy-gruen.png" alt="Brainy">
    <div id="aktion-box">Klick zum Starten!</div>
    <div id="ideen-box">
      <div class="ideen-label">💡 Ideen</div>
      <div class="ideen-chips" id="ideen-chips"></div>
    </div>
    <button class="wuerfel-btn" onclick="rollCube()">🎲 WÜRFELN</button>
  </div>
</div>

<script>
// Offizielle KLARTEXT-Barometer-Farben (siehe BAROMETER_KIND.html)
var KATEGORIEN = [
  {
    name: 'Gelb · Nomen',
    img: 'brainy-gelb.png',
    bg: 'linear-gradient(135deg,#D4A800,#A88000)',
    textColor: '#2D2200',
    aktion: 'Detektiv-Suche: Such diesen Gegenstand im Raum und berühr ihn!',
    beispiele: ['Der Stift', 'Das Buch', 'Der Tisch']
  },
  {
    name: 'Grün · Verben',
    img: 'brainy-gruen.png',
    bg: 'linear-gradient(135deg,#2E9E5A,#1A7A3A)',
    textColor: '#fff',
    aktion: 'Pantomime: Mach diese Bewegung vor, ohne zu sprechen!',
    beispiele: ['Schreiben', 'Laufen', 'Lachen']
  },
  {
    name: 'Orange · Adjektive',
    img: 'brainy-orange.png',
    bg: 'linear-gradient(135deg,#D4651A,#A84A10)',
    textColor: '#fff',
    aktion: 'Brainy-Check: Sag einen Satz mit diesem Wort über Brainy!',
    beispiele: ['Brainy ist leise', 'Brainy ist schnell', 'Brainy ist froh']
  },
  {
    name: 'Rot · Signale',
    img: 'brainy-rot.png',
    bg: 'linear-gradient(135deg,#C0392B,#8B1A1A)',
    textColor: '#fff',
    aktion: 'Stopp-Signal: Mach das passende Handzeichen dazu!',
    beispiele: ['Stopp!', 'Achtung!', 'Hilfe!']
  },
  {
    name: 'Grau · Pause/Gefühl',
    img: 'brainy-grau.png',
    bg: 'linear-gradient(135deg,#757575,#555555)',
    textColor: '#fff',
    aktion: 'Barometer-Zeit: Zeig deine Farbe auf dem Barometer!',
    beispiele: []
  },
  {
    name: 'Joker · Brainy mit Herz',
    img: 'brainy-joker.png',
    bg: 'linear-gradient(135deg,#2E9E5A,#D4A800,#D4651A,#C0392B,#757575)',
    textColor: '#fff',
    aktion: 'Freie Wahl: Such dir eine Farbe und eine Aufgabe aus!',
    beispiele: []
  }
];

function rollCube(){
  var img = document.getElementById('brainy-img');
  var aktionBox = document.getElementById('aktion-box');
  var ideenBox = document.getElementById('ideen-box');
  var ideenChips = document.getElementById('ideen-chips');
  img.classList.add('spin');

  setTimeout(function(){
    img.classList.remove('spin');
    var kat = KATEGORIEN[Math.floor(Math.random() * KATEGORIEN.length)];

    img.src = kat.img;
    aktionBox.textContent = kat.aktion;
    aktionBox.style.background = kat.bg;
    aktionBox.style.color = kat.textColor;

    if (kat.beispiele.length) {
      ideenChips.innerHTML = kat.beispiele.map(function(w){ return '<span class="ideen-chip">' + w + '</span>'; }).join('');
      ideenBox.classList.add('zeigen');
    } else {
      ideenChips.innerHTML = '';
      ideenBox.classList.remove('zeigen');
    }
  }, 600);
}
</script>

</body>
</html>
