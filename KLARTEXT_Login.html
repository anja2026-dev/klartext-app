<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLARTEXT · Anmeldung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"DM Sans",sans-serif;background:linear-gradient(135deg,#0F2230 0%,#1B3A4B 60%,#2A5570 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;}
.logo-wrap{text-align:center;margin-bottom:2rem;}
.logo-mark{width:56px;height:56px;border:2.5px solid #6EC6A0;border-radius:11px;display:flex;align-items:center;justify-content:center;margin:0 auto .75rem;}
.logo-mark span{font-family:"Playfair Display",serif;font-size:20px;font-weight:700;color:#fff;}
.logo-name{font-family:"Playfair Display",serif;font-size:1.5rem;font-weight:700;color:#fff;}
.logo-sub{font-size:.62rem;color:rgba(255,255,255,.4);letter-spacing:.2em;text-transform:uppercase;margin-top:3px;}
.card{background:#fff;border-radius:16px;padding:2rem;width:100%;max-width:440px;box-shadow:0 24px 60px rgba(0,0,0,.35);}
.card-titel{font-family:"Playfair Display",serif;font-size:1.15rem;font-weight:700;color:#1B3A4B;margin-bottom:.25rem;text-align:center;}
.card-sub{font-size:.8rem;color:#7A7060;text-align:center;margin-bottom:1.5rem;}
.feld{margin-bottom:1rem;}
.feld-label{font-size:.7rem;font-weight:700;color:#1B3A4B;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.4rem;display:block;}
.pw-row{display:flex;gap:.5rem;}
.feld-input{flex:1;padding:.6rem .85rem;border:1.5px solid #DDD8CE;border-radius:8px;font-family:"DM Sans",sans-serif;font-size:.9rem;outline:none;color:#1B3A4B;width:100%;}
.feld-input:focus{border-color:#1B3A4B;}
.pw-toggle{background:none;border:none;cursor:pointer;color:#7A7060;font-size:1rem;padding:.4rem;}
.login-btn{width:100%;padding:.75rem;border-radius:10px;border:none;font-family:"DM Sans",sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;color:#fff;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:.4rem;background:#1B3A4B;margin-top:.5rem;}
.login-btn:hover{opacity:.9;transform:translateY(-1px);}
.login-btn:disabled{opacity:.6;cursor:default;transform:none;}
.err{display:none;font-size:.78rem;color:#C62828;text-align:center;margin-top:.75rem;padding:.4rem;background:#FDECEA;border-radius:6px;}
.err.show{display:block;}
.hint{text-align:center;margin-top:1.25rem;}
.hint a{font-size:.72rem;color:#7A7060;text-decoration:none;}
.hint a:hover{color:#1B3A4B;}
</style>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KLARTEXT">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1B3A4B">
</head>
<body>

<div class="logo-wrap">
  <div class="logo-mark"><span>K</span></div>
  <div class="logo-name">KLARTEXT</div>
  <div class="logo-sub">Mentoring-System</div>
</div>

<div class="card">
  <div class="card-titel">Willkommen</div>
  <div class="card-sub">Bitte gib deinen Lizenzschlüssel ein, um fortzufahren.</div>

  <div class="feld">
    <span class="feld-label">Lizenzschlüssel</span>
    <input class="feld-input" type="text" id="code-input" placeholder="z. B. anker26" autocomplete="off" autocapitalize="off" spellcheck="false"
      onkeydown="if(event.key==='Enter')login();">
  </div>

  <button class="login-btn" id="login-btn" onclick="login()" type="button">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.5"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
    Einloggen
  </button>

  <div class="err" id="err">Dieser Lizenzschlüssel wurde nicht erkannt.</div>

  <div class="hint">
    <a href="KLARTEXT_Landing.html">← Zurück zur Startseite</a>
  </div>
</div>

<script>
// ═══════════════════════════════════════
// OFFLINE-FIRST: kein Supabase-Login mehr. Der Zugang läuft rein
// clientseitig über einen Lizenzschlüssel, dessen SHA-256-Hash gegen eine
// feste Liste geprüft wird (die Klartext-Codes selbst stehen nicht im
// Quelltext, nur ihre Hashes). Jeder Code trägt jetzt zwei Infos: ein
// optionales Paket-Kürzel (bundle, für gekaufte Digistore24-Inhaltspakete)
// und eine Rolle (role, steuert die Dashboard-Kachel-Filterung). Die vier
// bestehenden Bundle-Codes bleiben unverändert gültig (echte Kundschaft!)
// und bekommen zusätzlich eine sinnvolle Standard-Rolle; die fünf neuen
// Codes sind reine Rollen-Logins ohne Paket-Bindung (bundle: null).
// ═══════════════════════════════════════
var LIZENZ_HASHES = {
  '444524db37fbbdf998367f11f5828a838b1b085f0110ad6af15e6cb3210c5f45': { bundle: 'alltag',   role: 'ingra'    }, // anker26
  '9325f5e2db165b7d9fc2bb53d6a299db811f7576c3f4023033a18ed394dbdae5': { bundle: 'beruf',     role: 'jobcoach' }, // w2tfn1
  '1550e6234375a76a19ab22c89f50739d790ece390c16ddf5bbdc5ddadebf9bd0': { bundle: 'sprache',   role: 'lehrkraft'}, // sprache24
  '99395d07aa6bbfa7e5d8287d0857c1d65227d1a109de0d6db7c4512a90c5085f': { bundle: 'komplett',  role: 'admin'    }, // komplett79
  'af004ec4b152089d31cf7d5b157a8cecb8c1507777c0ee20fff2458582f139c6': { bundle: null,        role: 'ingra'    }, // sb-ingra26
  'd371c436104677cc05cbbdb793f41cdbc3dbce6c210e49e5982195fe579d4566': { bundle: null,        role: 'jobcoach' }, // jc-beruf26
  'af7ccdd8307de34f5f6bbbf452be7879b97cfdd64fc572e64a68695ba27804e7': { bundle: null,        role: 'lehrkraft'}, // lehrkraft24
  'a367ec32138fe8c9ec794adc21d7a36bd2c79bf7cf42adbb5df0801149f59c23': { bundle: null,        role: 'ogs'      }, // ogs-team26
  'e4e9c7753a17762cb5da4be450fcf8af3767af804364057dcce6c2bd8b9fcbe5': { bundle: null,        role: 'eltern'   }, // eltern-anker
  '417988be54939c1fbdd3b89145f3483186f9cc284fc06df45b0a525463d34d4a': { bundle: null,        role: 'tk'       }, // tk-leitung26
  '852096b3c357c7dadaeb2dd713d7c8e41020b48f6936f0cd0988815f6af7699b': { bundle: null,        role: 'mobbing'  }, // mobbing26
  '677804d927bba707259a570ffe0f598ddcda75d8546b0021ad2cca010b0d90d1': { bundle: null,        role: 'jobcoach' }  // dank26 (Daniel Mann, persoenlicher Dank-Zugang)
};

async function sha256Hex(text) {
  var buf = new TextEncoder().encode(text.trim().toLowerCase());
  var hashBuf = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hashBuf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}

function zeigeFehler(text) {
  var err = document.getElementById('err');
  err.textContent = text;
  err.classList.add('show');
}

async function login() {
  var btn = document.getElementById('login-btn');
  var code = document.getElementById('code-input').value.trim();
  document.getElementById('err').classList.remove('show');

  if (!code) {
    zeigeFehler('Bitte deinen Lizenzschlüssel eingeben.');
    return;
  }

  btn.disabled = true;
  var hash = await sha256Hex(code);
  var eintrag = LIZENZ_HASHES[hash];

  if (!eintrag) {
    zeigeFehler('Dieser Lizenzschlüssel wurde leider nicht erkannt — bitte prüfe die Schreibweise. Bei Fragen meldet sich dein Support-Team gerne.');
    btn.disabled = false;
    return;
  }

  try {
    if (eintrag.bundle) localStorage.setItem('klartext_active_bundle', eintrag.bundle);
    sessionStorage.setItem('klartext_role', eintrag.role);
    sessionStorage.setItem('klartext_login', 'true');
  } catch (e) {}

  window.location.href = 'DASHBOARD.html';
}

window.login = login;

// Bereits in dieser Session eingeloggt (z.B. nach Reload) -> direkt weiter,
// kein erneutes Eintippen nötig.
(function(){
  try {
    if (sessionStorage.getItem('klartext_login') === 'true') {
      window.location.href = 'DASHBOARD.html';
    }
  } catch (e) {}
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js')
      .then(r => console.log('SW registered'))
      .catch(e => console.log('SW failed:', e));
  });
}
</script></body>
</html>
