<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLARTEXT · Therapeuten-Ticket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--m:#B71C1C;--l:#FBE4E4;--b:#F0BCBC;--kt:#1B3A4B;--accent:#6EC6A0;--ink:#1A1A2E;--muted:#6A6878;--border:#DDD8CE;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"DM Sans",sans-serif;background:#E8E4DC;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem 3rem;gap:1rem;}
.controls{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;}
.ctrl{padding:.4rem .9rem;border-radius:6px;font-family:"DM Sans",sans-serif;font-size:.78rem;font-weight:700;cursor:pointer;border:none;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:.35rem;}
.ctrl-print{background:var(--m);color:#fff;}
.ctrl-back{background:rgba(27,58,75,.15);color:#1B3A4B;border:1.5px solid rgba(27,58,75,.2);}
.hinweistext{width:210mm;max-width:100%;font-size:.68rem;color:var(--muted);text-align:center;}
.sheet{width:210mm;max-width:100%;background:#fff;box-shadow:0 8px 40px rgba(0,0,0,.2);display:flex;flex-direction:column;}
.a5{width:210mm;height:148mm;border-bottom:1px dashed #C7BFAF;display:flex;}
.a5:last-child{border-bottom:none;}
.a5-half{flex:1;display:flex;flex-direction:column;}
.a5-half.back{border-left:1px dashed #C7BFAF;}
.a5h{background:linear-gradient(135deg,var(--kt) 0%,#2A5570 100%);padding:4mm 6mm 3mm;display:flex;align-items:center;justify-content:space-between;}
.a5h-logo{display:flex;align-items:center;gap:2mm;}
.a5h-mark{width:18px;height:18px;border:1.5px solid var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.a5h-mark span{font-family:"Playfair Display",serif;font-size:9px;font-weight:700;color:#fff;}
.a5h-name{font-family:"Playfair Display",serif;font-size:.62rem;font-weight:700;color:#fff;line-height:1;}
.a5h-sub{font-size:.36rem;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;display:block;}
.a5h-titel{font-family:"Playfair Display",serif;font-size:.66rem;font-weight:700;color:#fff;text-align:right;line-height:1.2;}
.a5h-richtung{font-size:.46rem;color:rgba(255,255,255,.6);text-align:right;margin-top:.5mm;}
.a5-stripe{height:2px;background:linear-gradient(90deg,var(--m) 0%,var(--b) 100%);}
.a5-body{padding:4mm 6mm;flex:1;display:flex;flex-direction:column;gap:3.5mm;}
.meta-row{display:grid;grid-template-columns:1.3fr 1fr;gap:3mm;}
.mf-label{font-size:.46rem;font-weight:700;color:var(--m);letter-spacing:.08em;text-transform:uppercase;margin-bottom:1mm;display:block;}
.mf-input{width:100%;border:none;border-bottom:1px solid #C0B8A8;padding:.25rem 0;font-family:"DM Sans",sans-serif;font-size:.72rem;color:var(--ink);outline:none;background:transparent;}
.sek-titel{font-size:.5rem;font-weight:700;color:var(--m);letter-spacing:.07em;text-transform:uppercase;margin-bottom:1.6mm;padding-bottom:1mm;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:1.3mm;}
.sek-titel span{font-size:.65rem;}
.baro-reihe{display:flex;gap:1.5mm;flex-wrap:wrap;}
.baro-opt{display:flex;align-items:center;gap:1mm;padding:1.3mm 2.4mm;border-radius:10px;border:1px solid #E0D8CC;font-size:.54rem;font-weight:600;background:#fff;}
.baro-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.check-item{display:flex;align-items:center;gap:1.8mm;font-size:.56rem;color:var(--ink);margin-bottom:1.8mm;}
.check-box{width:9px;height:9px;border:1.3px solid #A89E8C;border-radius:2px;flex-shrink:0;}
.line-row{border-bottom:1px solid #E0D8CC;height:4.5mm;}
.a5-footer{background:var(--l);border-top:1px solid var(--b);padding:1.2mm 6mm;text-align:center;}
.a5f{font-size:.36rem;color:var(--muted);}
@media print{
  input::placeholder,textarea::placeholder{color:transparent!important;}
  body{background:white;padding:0;}
  .controls,.hinweistext{display:none!important;}
  .sheet{box-shadow:none;width:100%;}
  .a5{border-bottom:1px dashed #999;}
  .a5-half.back{border-left:1px dashed #999;}
  @page{size:A4;margin:0;}
}
</style>
</head>
<body>
<div class="controls">
  <button class="ctrl ctrl-print" onclick="window.print()">🖨️ Als PDF drucken</button>
  <a class="ctrl ctrl-back" href="KLARTEXT_Landing.html">← Zurück</a>
</div>
<div class="hinweistext">Beide Hälften stehen nebeneinander auf einem Blatt (kein beidseitiger Druck nötig) – nach dem Ausschneiden liegen Schul-Notiz und Therapie-Rückmeldung als ein zusammengehöriges Ticket vor.</div>
<div class="sheet" id="sheet"></div>
<template id="card-template">
  <div class="a5">
    <div class="a5-half front">
      <div class="a5h">
        <div class="a5h-logo">
          <div class="a5h-mark"><span>K</span></div>
          <div><div class="a5h-name">KLARTEXT</div><span class="a5h-sub">Mentoring</span></div>
        </div>
        <div><div class="a5h-titel">Therapeuten-Ticket</div><div class="a5h-richtung">Schule ➔ Therapie</div></div>
      </div>
      <div class="a5-stripe"></div>
      <div class="a5-body">
        <div class="meta-row">
          <div><span class="mf-label">Kind</span><input class="mf-input" type="text" placeholder="Name"></div>
          <div><span class="mf-label">Datum</span><input class="mf-input" type="text" placeholder="TT.MM."></div>
        </div>
        <div>
          <div class="sek-titel"><span>🌡️</span> Regulations-Barometer heute</div>
          <div class="baro-reihe">
            <div class="baro-opt"><div class="baro-dot" style="background:#2E9E5A;"></div>Grün</div>
            <div class="baro-opt"><div class="baro-dot" style="background:#D4A800;"></div>Gelb</div>
            <div class="baro-opt"><div class="baro-dot" style="background:#D4651A;"></div>Orange</div>
            <div class="baro-opt"><div class="baro-dot" style="background:#C0392B;"></div>Rot</div>
            <div class="baro-opt"><div class="baro-dot" style="background:#757575;"></div>Grau</div>
          </div>
        </div>
        <div>
          <div class="sek-titel"><span>⚡</span> Heutige Tages-Trigger</div>
          <label class="check-item"><div class="check-box"></div>Klassenarbeit / Prüfungssituation</label>
          <label class="check-item"><div class="check-box"></div>Streit in der Pause</label>
          <label class="check-item"><div class="check-box"></div>Lärmbelastung</label>
          <label class="check-item"><div class="check-box"></div>Sonstiges: <span style="border-bottom:1px solid #C0B8A8;flex:1;display:inline-block;margin-left:1mm;">&nbsp;</span></label>
        </div>
        <div style="flex:1;">
          <div class="sek-titel"><span>✏️</span> Das lief heute gut / Das war heute schwer</div>
          <div class="line-row"></div>
          <div class="line-row" style="margin-top:2mm;"></div>
          <div class="line-row" style="margin-top:2mm;"></div>
          <div class="line-row" style="margin-top:2mm;"></div>
          <div class="line-row" style="margin-top:2mm;"></div>
        </div>
      </div>
      <div class="a5-footer"><span class="a5f">KLARTEXT Mentoring-System · info@klartext-mentoring.de</span></div>
    </div>
    <div class="a5-half back">
      <div class="a5h">
        <div class="a5h-logo">
          <div class="a5h-mark"><span>K</span></div>
          <div><div class="a5h-name">KLARTEXT</div><span class="a5h-sub">Mentoring</span></div>
        </div>
        <div><div class="a5h-titel">Therapeuten-Ticket</div><div class="a5h-richtung">Therapie ➔ Schule</div></div>
      </div>
      <div class="a5-stripe"></div>
      <div class="a5-body">
        <div class="meta-row">
          <div><span class="mf-label">Therapeut:in</span><input class="mf-input" type="text" placeholder="Name / Praxis"></div>
          <div><span class="mf-label">Datum</span><input class="mf-input" type="text" placeholder="TT.MM."></div>
        </div>
        <div>
          <div class="sek-titel"><span>🎯</span> Schwerpunkt der heutigen Therapie</div>
          <label class="check-item"><div class="check-box"></div>Auditive Merkspanne</label>
          <label class="check-item"><div class="check-box"></div>Stifthaltung</label>
          <label class="check-item"><div class="check-box"></div>Frusttoleranz</label>
          <label class="check-item"><div class="check-box"></div>Grob-/Feinmotorik</label>
          <label class="check-item"><div class="check-box"></div>Sonstiges: <span style="border-bottom:1px solid #C0B8A8;flex:1;display:inline-block;margin-left:1mm;">&nbsp;</span></label>
        </div>
        <div style="flex:1;">
          <div class="sek-titel"><span>💡</span> Blitz-Tipp für den Unterricht</div>
          <div class="line-row"></div>
          <div class="line-row" style="margin-top:2mm;"></div>
          <div class="line-row" style="margin-top:2mm;"></div>
          <div class="line-row" style="margin-top:2mm;"></div>
          <div class="line-row" style="margin-top:2mm;"></div>
        </div>
      </div>
      <div class="a5-footer"><span class="a5f">KLARTEXT Mentoring-System · info@klartext-mentoring.de</span></div>
    </div>
  </div>
</template>
<script>
const tpl = document.getElementById('card-template');
const sheet = document.getElementById('sheet');
for(let i=0;i<2;i++){ sheet.appendChild(tpl.content.cloneNode(true)); }
</script>
<script>
window.addEventListener('beforeprint',function(){
  document.querySelectorAll('input[placeholder]').forEach(function(el){
    el.setAttribute('data-ph', el.placeholder);
    el.removeAttribute('placeholder');
  });
});
window.addEventListener('afterprint',function(){
  document.querySelectorAll('input[data-ph]').forEach(function(el){
    el.setAttribute('placeholder', el.getAttribute('data-ph'));
    el.removeAttribute('data-ph');
  });
});
</script>
</body>
</html>
