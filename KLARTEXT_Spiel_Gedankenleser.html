<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLARTEXT · Der geheime Gedanken-Leser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B3A4B">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--m:#1B3A4B;--acc:#6EC6A0;--paper:#F5F0E8;--surface:#fff;--border:#DDD8CE;--ink:#2D2D2D;--muted:#7A7060;}
body{font-family:"DM Sans",sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;}
.header{background:var(--m);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(1rem,4vw,2rem);border-bottom:3px solid var(--acc);position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;}
.logo-mark{width:32px;height:32px;border:2px solid var(--acc);border-radius:6px;display:flex;align-items:center;justify-content:center;}
.logo-mark span{font-family:"Playfair Display",serif;font-size:12px;font-weight:700;color:#fff;}
.logo-text{font-family:"Playfair Display",serif;font-size:1rem;font-weight:700;color:#fff;}
.back-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .7rem;border:1.5px solid var(--acc);border-radius:20px;color:var(--acc);font-size:.7rem;font-weight:700;text-decoration:none;}
.hero{background:linear-gradient(135deg,var(--m) 0%,#2A5570 100%);padding:1.75rem clamp(1rem,4vw,2rem);text-align:center;}
.hero-icon{font-size:2.2rem;margin-bottom:.4rem;}
.hero-titel{font-family:"Playfair Display",serif;font-size:clamp(1.3rem,3vw,1.8rem);font-weight:700;color:#fff;margin-bottom:.3rem;}
.hero-sub{font-size:.82rem;color:rgba(255,255,255,.6);max-width:560px;margin:0 auto;}
.shell{max-width:560px;margin:0 auto;padding:2rem clamp(.75rem,3vw,2rem) 5rem;}
.frage-text{font-size:.95rem;font-weight:700;color:var(--m);text-align:center;margin-bottom:1.3rem;}
.gefuehle-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
.gefuehl-kachel{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:1.1rem .8rem;text-align:center;cursor:pointer;font-weight:700;font-size:.86rem;color:var(--ink);transition:all .15s;font-family:inherit;}
.gefuehl-kachel:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(27,58,75,.12);}
.gefuehl-emoji{font-size:1.8rem;display:block;margin-bottom:.4rem;}
.karte-box{background:var(--surface);border:2px solid var(--border);border-radius:22px;padding:2rem 1.5rem;box-shadow:0 4px 18px rgba(27,58,75,.1);text-align:center;}
.karte-brainy{width:min(45vw,160px);height:min(45vw,160px);object-fit:contain;margin-bottom:1rem;}
.karte-erkannt{font-family:"Playfair Display",serif;font-size:1.15rem;font-weight:700;color:var(--m);margin-bottom:1rem;}
.karte-uebung-titel{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:.5rem;}
.karte-uebung-text{font-size:.95rem;line-height:1.6;color:var(--ink);background:var(--paper);border-radius:14px;padding:1rem 1.1rem;margin-bottom:1.5rem;}
.haupt-btn{background:var(--m);color:#fff;border:none;padding:.95rem 2rem;font-family:inherit;font-size:1rem;font-weight:700;border-radius:50px;cursor:pointer;transition:background .2s,transform .15s;}
.haupt-btn:hover{background:#2A5570;transform:translateY(-1px);}
</style>
</head>
<body>

<header class="header">
  <a class="logo" href="KLARTEXT_Spiele.html">
    <div class="logo-mark"><span>K</span></div>
    <div class="logo-text">KLARTEXT · Interaktive Tools</div>
  </a>
  <a class="back-btn" href="KLARTEXT_Spiele.html">← Tools</a>
</header>

<div class="hero">
  <div class="hero-icon">🤫</div>
  <h1 class="hero-titel">Der geheime Gedanken-Leser</h1>
  <p class="hero-sub">Ein Kind rät, die Klasse stellt still ein Gefühl dar — achtsam wahrnehmen und gemeinsam entspannen.</p>
</div>

<div class="shell">

  <div id="eingabe-screen">
    <div class="frage-text">Welches Gefühl hat die Klasse stumm für dich dargestellt?</div>
    <div class="gefuehle-grid" id="gefuehle-grid"></div>
  </div>

  <div class="karte-box" id="karte-screen" style="display:none;">
    <img class="karte-brainy" id="karte-brainy" src="brainy-gruen.png" alt="Brainy">
    <div class="karte-erkannt">Genau richtig gelesen!</div>
    <div class="karte-uebung-titel">🪭 Karte aus Brainys Zauberfächer</div>
    <div class="karte-uebung-text" id="karte-uebung-text"></div>
    <button class="haupt-btn" onclick="naechsteRunde()">🔄 Nächste Runde starten</button>
  </div>

</div>

<script>
var GEFUEHLE = [
  { emoji:'🟢', label:'Entspannt & Sicher', brainy:'brainy-gruen.png',
    uebung:'Weiter so! Macht ein stilles High-Five in der Runde — ein Lächeln reicht einmal rundherum.' },
  { emoji:'🟡', label:'Angespannt & Hibbelig', brainy:'brainy-gelb.png',
    uebung:'Das Wackel-Los: Schüttelt 10 Sekunden lang eure Hände ganz locker aus, dann tief durchatmen.' },
  { emoji:'🟠', label:'Wütend & Sauer', brainy:'brainy-orange.png',
    uebung:'Das Wut-Ausschütteln — alle schütteln 15 Sekunden lang kräftig ihre Hände und Füße aus!' },
  { emoji:'🟠', label:'Traurig & Besorgt', brainy:'brainy-orange.png',
    uebung:'Die Trost-Geste: Legt beide Hände sanft auf die eigenen Schultern und drückt euch selbst kurz.' },
  { emoji:'🔴', label:'Überfordert & Im Alarm', brainy:'brainy-rot.png',
    uebung:'Die 5-4-3-2-1-Übung: Nennt still für euch 5 Dinge, die ihr seht, 4, die ihr hört, 3, die ihr fühlt.' },
  { emoji:'⚪', label:'Erschöpft & Müde', brainy:'brainy-grau.png',
    uebung:'Die Riesen-Gähn-Welle: Gähnt einmal herzhaft und genüsslich und streckt euch dabei ganz groß.' }
];

function kachelnRendern(){
  var grid = document.getElementById('gefuehle-grid');
  grid.innerHTML = GEFUEHLE.map(function(g, i){
    return '<button class="gefuehl-kachel" onclick="gefuehlWaehlen(' + i + ')">' +
           '<span class="gefuehl-emoji">' + g.emoji + '</span>' + g.label + '</button>';
  }).join('');
}

function gefuehlWaehlen(i){
  var g = GEFUEHLE[i];
  document.getElementById('eingabe-screen').style.display = 'none';
  document.getElementById('karte-screen').style.display = 'block';
  document.getElementById('karte-brainy').src = g.brainy;
  document.getElementById('karte-uebung-text').textContent = g.uebung;
}

function naechsteRunde(){
  document.getElementById('karte-screen').style.display = 'none';
  document.getElementById('eingabe-screen').style.display = 'block';
}

kachelnRendern();
</script>

</body>
</html>
