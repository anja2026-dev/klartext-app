<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLARTEXT · OGS-Übergabe-Ticket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--m:#00838F;--l:#E0F4F6;--b:#B2E4E9;--kt:#1B3A4B;--accent:#6EC6A0;--ink:#1A1A2E;--muted:#6A6878;--border:#DDD8CE;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"DM Sans",sans-serif;background:#E8E4DC;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem 3rem;gap:1rem;}
.controls{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;}
.ctrl{padding:.4rem .9rem;border-radius:6px;font-family:"DM Sans",sans-serif;font-size:.78rem;font-weight:700;cursor:pointer;border:none;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:.35rem;}
.ctrl-print{background:var(--m);color:#fff;}
.ctrl-back{background:rgba(27,58,75,.15);color:#1B3A4B;border:1.5px solid rgba(27,58,75,.2);}

.sheet{width:210mm;max-width:100%;background:#fff;box-shadow:0 8px 40px rgba(0,0,0,.2);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
.a6{width:105mm;height:148mm;border:1px dashed #C7BFAF;display:flex;flex-direction:column;overflow:hidden;}
.a6-header{background:linear-gradient(135deg,var(--kt) 0%,#2A5570 100%);padding:4mm 5mm 3mm;display:flex;align-items:center;justify-content:space-between;}
.a6h-logo{display:flex;align-items:center;gap:2mm;}
.a6h-mark{width:20px;height:20px;border:2px solid var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.a6h-mark span{font-family:"Playfair Display",serif;font-size:10px;font-weight:700;color:#fff;}
.a6h-name{font-family:"Playfair Display",serif;font-size:.72rem;font-weight:700;color:#fff;line-height:1;}
.a6h-sub{font-size:.42rem;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;display:block;}
.a6h-titel{font-family:"Playfair Display",serif;font-size:.78rem;font-weight:700;color:#fff;text-align:right;line-height:1.2;}
.a6-stripe{height:2px;background:linear-gradient(90deg,var(--m) 0%,var(--b) 100%);}
.a6-body{padding:4.5mm 5mm 2mm;flex:1;display:flex;flex-direction:column;gap:4.5mm;}
.meta-row{display:grid;grid-template-columns:1.4fr 1fr;gap:3mm;}
.mf-label{font-size:.52rem;font-weight:700;color:var(--m);letter-spacing:.08em;text-transform:uppercase;margin-bottom:1.3mm;display:block;}
.mf-input{width:100%;border:none;border-bottom:1px solid #C0B8A8;padding:.3rem 0;font-family:"DM Sans",sans-serif;font-size:.82rem;color:var(--ink);outline:none;background:transparent;}
.sek-titel{font-size:.56rem;font-weight:700;color:var(--m);letter-spacing:.07em;text-transform:uppercase;margin-bottom:2mm;padding-bottom:1.3mm;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:1.3mm;}
.sek-titel span{font-size:.75rem;}
.baro-reihe{display:flex;gap:1.8mm;flex-wrap:wrap;}
.baro-opt{display:flex;align-items:center;gap:1.3mm;padding:1.6mm 2.8mm;border-radius:12px;border:1px solid #E0D8CC;font-size:.62rem;font-weight:600;background:#fff;font-family:"DM Sans",sans-serif;}
.baro-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.check-item{display:flex;align-items:center;gap:2.2mm;font-size:.68rem;color:var(--ink);margin-bottom:2.4mm;}
.check-box{width:12px;height:12px;border:1.5px solid #A89E8C;border-radius:2.5px;flex-shrink:0;}
.a6-footer{background:var(--l);border-top:1px solid var(--b);padding:1.6mm 5mm;display:flex;align-items:center;justify-content:center;gap:2mm;}
.a6f{font-size:.4rem;color:var(--muted);}
.a6f-qr{width:8mm;height:8mm;flex-shrink:0;background:#fff;}
.a6f-qr canvas,.a6f-qr img{width:100%;height:100%;display:block;}
.a6f-txt{font-size:.36rem;line-height:1.3;color:var(--muted);text-align:left;}
@media print{input::placeholder,textarea::placeholder{color:transparent!important;}
  body{background:white;padding:0;}
  .controls{display:none!important;}
  .sheet{box-shadow:none;width:100%;}
  .a6{border:1px dashed #999;}
  @page{size:A4;margin:0;}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="controls">
  <button class="ctrl ctrl-print" onclick="window.print()">🖨️ Als PDF drucken</button>
  <a class="ctrl ctrl-back" href="KLARTEXT_Landing.html">← Zurück</a>
</div>
<div class="sheet" id="sheet"></div>
<template id="card-template">
  <div class="a6">
    <div class="a6-header">
      <div class="a6h-logo">
        <div class="a6h-mark"><span>K</span></div>
        <div><div class="a6h-name">KLARTEXT</div><span class="a6h-sub">Mentoring</span></div>
      </div>
      <div class="a6h-titel">OGS-Übergabe<br>Vormittag → Nachmittag</div>
    </div>
    <div class="a6-stripe"></div>
    <div class="a6-body">
      <div class="meta-row">
        <div><span class="mf-label">Kind</span><input class="mf-input" type="text" placeholder="Name"></div>
        <div><span class="mf-label">Datum</span><input class="mf-input" type="text" placeholder="TT.MM."></div>
      </div>
      <div>
        <div class="sek-titel"><span>🌡️</span> Barometer bei Schulschluss</div>
        <div class="baro-reihe">
          <div class="baro-opt"><div class="baro-dot" style="background:#2E9E5A;"></div>Grün</div>
          <div class="baro-opt"><div class="baro-dot" style="background:#D4A800;"></div>Gelb</div>
          <div class="baro-opt"><div class="baro-dot" style="background:#D4651A;"></div>Orange</div>
          <div class="baro-opt"><div class="baro-dot" style="background:#C0392B;"></div>Rot</div>
          <div class="baro-opt"><div class="baro-dot" style="background:#757575;"></div>Grau</div>
        </div>
      </div>
      <div>
        <div class="sek-titel"><span>📋</span> Besonderes am Vormittag</div>
        <label class="check-item"><div class="check-box"></div>Nichts – alles super!</label>
        <label class="check-item"><div class="check-box"></div>Konflikt gelöst</label>
        <label class="check-item"><div class="check-box"></div>Hohe Reizüberflutung</label>
        <label class="check-item"><div class="check-box"></div>Körperliche Unruhe</label>
      </div>
      <div>
        <div class="sek-titel"><span>🧭</span> Empfohlene OGS-Startzone</div>
        <label class="check-item"><div class="check-box"></div>Ruhe-Insel (15 Min Rückzug)</label>
        <label class="check-item"><div class="check-box"></div>Tobe-Insel (Auspowern)</label>
        <label class="check-item"><div class="check-box"></div>Hausaufgaben-Fokus-Insel</label>
        <label class="check-item"><div class="check-box"></div>Freispiel</label>
      </div>
      <div>
        <div class="sek-titel"><span>✏️</span> Kurznotiz für die OGS</div>
        <input class="mf-input" type="text" placeholder="Platz für eine Zeile …" style="border-bottom:1px solid #E0D8CC;">
      </div>
    </div>
    <div class="a6-footer"><div class="a6f-qr qr-target"></div><span class="a6f-txt">Digital: klartext-app-8kl.pages.dev/LK_DL_OGS_Uebergabe.html</span></div>
  </div>
</template>
<script>
const tpl = document.getElementById('card-template');
const sheet = document.getElementById('sheet');
for(let i=0;i<4;i++){ sheet.appendChild(tpl.content.cloneNode(true)); }
document.querySelectorAll('.qr-target').forEach(function(el){
  new QRCode(el, {text:'https://klartext-app-8kl.pages.dev/LK_DL_OGS_Uebergabe.html', width:150, height:150, colorDark:'#1B3A4B', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M});
});
</script>
<script>
window.addEventListener('beforeprint',function(){
  document.querySelectorAll('input[placeholder]').forEach(function(el){
    el.setAttribute('data-ph', el.placeholder);
    el.removeAttribute('placeholder');
  });
});
window.addEventListener('afterprint',function(){
  document.querySelectorAll('input[data-ph]').forEach(function(el){
    el.setAttribute('placeholder', el.getAttribute('data-ph'));
    el.removeAttribute('data-ph');
  });
});
</script>
</body>
</html>
